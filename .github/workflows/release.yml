name: Release

# Push a tag like v1.0.0 to build LightSnap and attach the zip + checksum to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build universal app
        run: ./build.sh --zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/LightSnap.zip build/LightSnap.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "LightSnap $TAG" --generate-notes
